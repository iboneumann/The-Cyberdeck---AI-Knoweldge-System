name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      - name: Debug - List files
        run: |
          ls -la
          ls -la themes/
          
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.1'
          extended: true
          
      - name: Debug - Hugo version
        run: hugo version
        
      - name: Debug - Hugo config
        run: hugo config
        
      - name: Build with detailed output
        run: |
          hugo --verbose --debug --logLevel info
        continue-on-error: false
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

